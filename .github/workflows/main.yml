name: Deploy

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Sincronizar com a pasta do app
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='uploads' \
            "$GITHUB_WORKSPACE"/ /var/www/classpulse/dev/backend

      # - name: Instalar dependências
